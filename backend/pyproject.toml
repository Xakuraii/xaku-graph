[project]
name = "xakugraph-backend"
version = "0.1.0"
description = "Backend processing engine for XakuGraph Local-First Data & AI Studio"
authors = [{ name = "XakuGraph Contributors" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "polars>=1.6.0",
    "pyarrow>=17.0.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "python-multipart>=0.0.9",
    "fastexcel>=0.20.0",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "xlsxwriter>=3.2.0",
]
ml = [
    "torch>=2.4.0",
    "sentence-transformers>=3.0.0",
    "umap-learn>=0.5.6",
]
rag = [
    "chromadb>=0.5.0",
    "qdrant-client>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
