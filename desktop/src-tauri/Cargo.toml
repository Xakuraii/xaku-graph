[package]
name = "xakugraph-desktop"
version = "1.0.0"
description = "XakuGraph Desktop Shell"
authors = ["XakuGraph Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xakugraph-core = { path = "../../crates/xakugraph-core" }
